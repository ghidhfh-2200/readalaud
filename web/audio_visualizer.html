<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时语音可视化</title>
    <style>
        :root {
            --bs-primary: #0d6efd;
            --bs-danger: #dc3545;
            --bs-white: #ffffff;
            --bs-focus: rgba(13, 110, 253, 0.35);
        }
        .btn {
            display: inline-block;
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
            text-decoration: none;
            vertical-align: middle;
            cursor: pointer;
            user-select: none;
            background-color: transparent;
            border: 1px solid transparent;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            transition: all .15s ease-in-out;
        }
        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 0.2rem var(--bs-focus);
        }
        .btn-lg {
            padding: 0.6rem 1.1rem;
            font-size: 1.1rem;
        }
        .btn-outline-danger {
            color: var(--bs-danger);
            border-color: var(--bs-danger);
        }
        .btn-outline-danger:hover {
            color: var(--bs-white);
            background-color: var(--bs-danger);
        }
        .btn-outline-primary {
            color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .btn-outline-primary:hover {
            color: var(--bs-white);
            background-color: var(--bs-primary);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #visualizer {
            display: block;
        }
        .buttons_bar {
            position: absolute;
            left: 0;
            right: 0;
            top: 60%;
            height: 40%;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .inner-container {
            position: relative;
            left: 50%;
            right: 50%;
            display: flex;
            flex-direction: row;
            gap: 8px;
            transform: translateX(-50%);
        }
        .inform-bar {
            border-radius: 0px 0px 45px 45px;
            background-color: #92929256;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 40%;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="inform-bar">
        <div id="formation_bar", style="position: absolute;top: 0;height: 60%;width: 100%;">
            <p id="spl_value" style="color: green;line-height: 100%;text-align: center;font-size: 100px;">-- dB</p>
        </div>
        <div id="buttons", class="buttons_bar">
            <div id="inner-container" class="inner-container">
                <button id="stop" class="btn btn-outline-danger btn-lg" onclick="end_reading()">停止朗读</button>
                <button id="continue" class="btn btn-outline-primary btn-lg" onclick="continue_reading()">继续朗读</button>
                <button id="pause" class="btn btn-outline-primary btn-lg" onclick="pause_reading()">暂停朗读</button>
            </div>
        </div>
    </div>
    <canvas id="visualizer" style="position: absolute;bottom: 0;"></canvas>

    <script>
    // 获取Canvas元素
    
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    
    // 音频相关变量
    let audioContext;
    let analyser;
    let microphone;
    let dataArray;
    let timeDomainArray;
    let animationId;
    let isActive = false;
    let previousData = null; // Initialize as null, will be Uint8Array
    let processTimer = null; // 新增：processAudio 定时器句柄
    let workerTimer = null;  // 新增：worker_data 定时器句柄
    const splDisplay = document.getElementById('spl_value');
    let CALIBRATION_OFFSET_DB = 94;
    let if_paused = false;

    // WebSocket streaming
    let audioSocket = null;
    let audioProcessor = null;
    let pcmBuffer = null; // Reusable PCM buffer
    let workerBlobURL = null; // Store for cleanup
    let worker = null;

    // 设置Canvas尺寸为窗口大小
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.6;
    }
    
    // 初始化尺寸并监听窗口大小变化
    resizeCanvas();
    
    // 防抖函数限制调整大小事件的频率
    function debounce(func, wait) {
        let timeout;
        return function (...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }
    
    // 使用防抖的调整大小监听器
    window.addEventListener('resize', debounce(resizeCanvas, 100));
    
    // 初始化音频分析器
    function initAudio() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;

        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        if (!previousData || previousData.length !== bufferLength) {
            previousData = new Uint8Array(bufferLength); // Use TypedArray instead of Array
        }
        // 时域缓冲长度使用 fftSize
        const fftSize = analyser.fftSize;
        if (!timeDomainArray || timeDomainArray.length !== fftSize) {
            timeDomainArray = new Float32Array(fftSize);
        }
    }
    
    // 停止可视化
    function stopVisualization() {
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        // 清除新增的定时器
        if (processTimer !== null) {
            clearInterval(processTimer);
            processTimer = null;
        }
        if (workerTimer !== null) {
            clearInterval(workerTimer);
            workerTimer = null;
        }
        
        // Clean up Worker
        if (worker) {
            worker.terminate();
            worker = null;
        }
        if (workerBlobURL) {
            URL.revokeObjectURL(workerBlobURL);
            workerBlobURL = null;
        }
        
        // Clean up Streaming
        if (audioProcessor) {
            audioProcessor.disconnect();
            audioProcessor.onaudioprocess = null;
            audioProcessor = null;
        }
        if (audioSocket) {
            audioSocket.close();
            audioSocket = null;
        }
        
        // Clear reusable buffers
        pcmBuffer = null;

        isActive = false;
    }
    
    // Web Worker script as a string - optimized to reuse arrays
    const workerScript = `
        // Store previous smoothed values in Q8.8 fixed-point (Uint16) to avoid Float32Array
        // Memory per bin: prev 2 bytes + out 1 byte = 3 bytes/bin (very small)
        let prevQ88 = null;   // Uint16Array
        let outU8 = null;     // Uint8Array

        // Weights in Q0.8: 0.3 ~= 77/256, 0.7 ~= 179/256
        const A = 77;
        const B = 179;

        onmessage = (event) => {
            const inU8 = event.data; // EXPECTED: Uint8Array
            const n = inU8.length | 0;

            if (!prevQ88 || prevQ88.length !== n) {
                prevQ88 = new Uint16Array(n);
                outU8 = new Uint8Array(n);
            }

            for (let i = 0; i < n; i++) {
                const inQ88 = inU8[i] << 8; // convert input to Q8.8
                const smQ88 = (inQ88 * A + prevQ88[i] * B) >> 8; // back to Q8.8
                prevQ88[i] = smQ88;
                outU8[i] = smQ88 >> 8; // back to 0..255
            }

            postMessage(outU8); // reused; avoids allocating a new array each frame
        };
    `;

    // Create a Blob URL for the worker
    const workerBlob = new Blob([workerScript], { type: 'application/javascript' });
    workerBlobURL = URL.createObjectURL(workerBlob);

    // Initialize the Web Worker using the Blob URL
    worker = new Worker(workerBlobURL);

    // Limit refresh rate to 30 FPS
    const FRAME_INTERVAL = 1000 / 40;
    let lastFrameTime = 0;

    // Modify drawVisualization to use worker data - optimized for memory
    function drawVisualization(processedData) {
        const now = performance.now();
        if (now - lastFrameTime < FRAME_INTERVAL) return;
        lastFrameTime = now;

        // Use clearRect instead of fillRect for better performance
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / processedData.length) * 2.5;
        const dataLength = processedData.length;
        const heightScale = canvas.height / 255;
        const hueStep = 200 / dataLength;
        let x = 0;
        let hue, alpha, barHeight, y;

        for (let i = 0; i < dataLength; i++) {
            barHeight = processedData[i] * heightScale;
            hue = 180 + (i * hueStep);
            alpha = 0.6 + (processedData[i] / 255) * 0.4;
            
            // Reuse fillStyle string building
            ctx.fillStyle = `hsla(${hue},100%,50%,${alpha})`;
            y = canvas.height - barHeight;
            ctx.fillRect(x, y, barWidth, barHeight);

            if (barHeight > 5) {
                ctx.fillStyle = `hsla(${hue},100%,80%,${alpha * 0.8})`;
                ctx.fillRect(x, y, barWidth, Math.max(2, barHeight * 0.15));
            }

            x += barWidth + 1;
        }
    }
    let count = 0
    // Modify startMic to send data to the worker
    async function startMic() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

            if (!audioContext) {
                initAudio();
            } else if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            if (microphone) {
                microphone.disconnect();
            }

            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);

            // --- STREAMING LOGIC ---
            if (!audioSocket || audioSocket.readyState === WebSocket.CLOSED) {
                audioSocket = new WebSocket("ws://127.0.0.1:8008/audio_stream");
                audioSocket.onopen = () => console.log("Audio Stream Connected");
                audioSocket.onerror = (e) => console.error("WebSocket Error:", e);
            }

            if (audioProcessor) {
                audioProcessor.disconnect();
                audioProcessor.onaudioprocess = null;
            }

            // Create a ScriptProcessorNode to capture raw audio data
            audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);
            microphone.connect(audioProcessor);

            // Connect to destination to keep the processor alive, but use a GainNode to mute feedback
            const muteGain = audioContext.createGain();
            muteGain.gain.value = 0;
            audioProcessor.connect(muteGain);
            muteGain.connect(audioContext.destination);

            audioProcessor.onaudioprocess = (e) => {
                if (!isActive || if_paused || !audioSocket || audioSocket.readyState !== WebSocket.OPEN) return;

                const inputData = e.inputBuffer.getChannelData(0); // Float32
                const inputLength = inputData.length;

                // Reuse PCM buffer instead of creating new one each frame
                if (!pcmBuffer || pcmBuffer.length !== inputLength) {
                    pcmBuffer = new Int16Array(inputLength);
                }

                // Convert Float32 to Int16 (PCM) - optimized loop
                for (let i = 0; i < inputLength; i++) {
                    const s = Math.max(-1, Math.min(1, inputData[i]));
                    pcmBuffer[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                // Send binary data using transferable to avoid copy
                audioSocket.send(pcmBuffer.buffer);
            };
            // -----------------------

            isActive = true;

            // 独立启动 processAudio（只处理时域数据与 SPL，每秒一次）
            function processAudio() {
                if (!isActive) return;

                analyser.getFloatTimeDomainData(timeDomainArray);
                let sumSquares = 0;
                const timeLength = timeDomainArray.length;
                const invLength = 1 / timeLength;
                // Optimized loop - avoid repeated length access
                for (let i = 0; i < timeLength; i++) {
                    const s = timeDomainArray[i];
                    sumSquares += s * s;
                }
                const rms = Math.sqrt(sumSquares * invLength) || Number.EPSILON;
                const dbfs = 20 * (Math.log10 ? Math.log10(rms) : Math.log(rms) / Math.LN10);
                const dbSpl = dbfs + CALIBRATION_OFFSET_DB;
                if (splDisplay) {
                    splDisplay.textContent = `${Math.round(dbSpl)} dB`;
                    if (if_paused) {
                        try {
                            count++
                            if (count % 2 == 0) {
                                send_post("paused", dbSpl)
                            }
                        } catch (e) {
                            console.error(e)
                        }
                        return;
                    }
                    if (dbSpl >= window.threshold) {
                        if (timer_running) {
                            createThresholdTimer().clear()
                        }
                        state = "reading"
                    }
                    else {
                        if (timer_running) {
                            if_too_long = createThresholdTimer().isBelowThreshold()
                            console.log(if_too_long)
                            if (if_too_long) {
                                state = "pre-paused"
                            }
                            else {
                                state = "db-paused"
                            }
                        }
                        else {
                            createThresholdTimer().start()
                        }
                    }
                    try {
                        count++
                        console.log(count)
                        if (count % 2 == 0) {
                            console.log(state)
                            send_post(state, dbSpl)
                        }
                    }
                    catch (e) {
                        console.error(e)
                        console.log("failed to send data post to the server!")
                    }
                }
                
            }

            // 独立启动 worker_data（按 FRAME_INTERVAL 发送频谱数据到 worker）
            function worker_data() {
                if (!isActive) return;
                // 每次发送前先获取最新频谱数据
                analyser.getByteFrequencyData(dataArray);
                // Create copy and send with transferable (avoids slice overhead, transfers ownership)
                const bufferCopy = new Uint8Array(dataArray);
                worker.postMessage(bufferCopy, [bufferCopy.buffer]);
            }
            //独立启动read_timer,发送朗读计时数据到服务器
            // 用独立的定时器分别调度，互不影响
            processTimer = setInterval(processAudio, 500);         // 每秒2帧
            workerTimer = setInterval(worker_data, FRAME_INTERVAL); 

        } catch (err) {
            console.error('麦克风访问错误:', err);
            stopVisualization();
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('无法访问麦克风，请检查权限设置', canvas.width/2, canvas.height/2);
        }
    }
    let timer_running = false;
    function createThresholdTimer(thresholdMs = 5000) {
        let cleared = false;

        return {
            start() {
                // 启动计时：若处于 cleared 或 未运行则开始计时；若已在运行则保持不变
                if (!timer_running) {
                    window.startTime = Date.now();
                    timer_running = true;
                    cleared = false;
                }
            },
            stop() {
                // 停止计时并进入关闭态（不重置 elapsed）
                timer_running = false;
            },
            clear() {
                // 清空并保持关闭（重置 elapsed）
                timer_running = false;
                cleared = true;
                window.startTime = null;
            },
            isBelowThreshold() {
                return (Date.now() - window.startTime) < thresholdMs;
            },
            getElapsed() {
                if (!timer_running || window.startTime === null) return 0;
                return Date.now() - window.startTime;
            }
        };
    }
    // Listen for processed data from the worker
    worker.onmessage = (event) => {
        drawVisualization(event.data);
    };

    // 页面加载完成后自动启动
    window.addEventListener('load', function() {
        const url = window.location
        fetch('http://127.0.0.1:8008/get_temp', {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({'msg': "get_temp"})
        })
            .then(response => response.json())
            .then(params => {
                console.log("Parameters loaded from JSON file:", params);
                // Use the parameters in your HTML/JavaScript logic
                CALIBRATION_OFFSET_DB = Number(params.calibration)
                window.threshold = Number(params.threshold)
            })
            .catch(error => console.error("Error loading parameters:", error));
        startMic()
    });
    function send_post(state, dB) {
        fetch("http://127.0.0.1:8008/get_state", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({'state': state, "db": dB})
        })
        .then(response => response.json())
        .then(params => {
            if (params == "err") {
                console.log("ERR:send_failed")
            }
        })
        .catch(err => {
            alert(err)
        })
    }
    // 卸载页面前的清理工作
    window.addEventListener('beforeunload', () => {
        stopVisualization();
        if (audioContext) {
            audioContext.close();
        }
        end_reading()
    });
    function end_reading() {
        fetch("http://127.0.0.1:8008/end_reading", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({"end": true})
        })
        .then(response => response.json())
        .then(data => {
            console.log("Response data:", data); // Debugging log
            if (data && data.msg === "ok") {
                window.close();
            } else {
                alert(`Error: ${data?.msg || "Unexpected response format"}`);
            }
        })
        .catch(error => {
            console.error("Fetch error:", error);
        });
    }
    function pause_reading() {
        /* Set the flag to true */
        if_paused = true;
        /* Send a pause signal immediately to stop the backend processing */
        send_post("paused", 0);
    }

    function continue_reading() {
        /* Set the flag to false to resume normal processing */
        if_paused = false;
    }
    </script>
</body>
</html>
