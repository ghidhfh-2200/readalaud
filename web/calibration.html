<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <title>实时语音可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #visualizer {
            display: block;
        }
        .buttons_bar {
            position: absolute;
            left: 0;
            right: 0;
            top: 60%;
            height: 40%;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .inner-container {
            position: relative;
            height: 50%;
            left: 50%;
            right: 50%;
            display: flex;
            flex-direction: row;
            gap: 5px;
            transform: translateX(-50%);
        }
        .inform-bar {
            border-radius: 0px 0px 45px 45px;
            background-color: #92929256;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 40%;
            display: flex;
            flex-direction: column;
        }
        input::placeholder {
            color: rgba(221, 4, 4, 0.454);
        }
    </style>
</head>
<body>
    <div class="inform-bar">
        <div id="formation_bar", style="position: absolute;top: 0;height: 60%;width: 100%;">
            <p id="spl_value" style="color: green;line-height: 100%;text-align: center;font-size: 100px;">-- dB</p>
        </div>
        <div id="buttons", class="buttons_bar">
            <div id="inner-container" class="inner-container">
                <input type="text", placeholder="输入环境分贝值", class="form-control" style="background-color: #92929213;color: white;" id="input-db" onchange="change_calibration()">
                <button id="calibration" class="btn btn-outline-danger btn-lg" style="width: 200px;" onclick="calibration()">开始校准</button>
            </div>
        </div>
    </div>
    <canvas id="visualizer" style="position: absolute;bottom: 0;"></canvas>

    <script>
    // 获取Canvas元素
    
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    
    // 音频相关变量
    let audioContext;
    let analyser;
    let microphone;
    let dataArray;
    let timeDomainArray;
    let animationId;
    let isActive = false;
    let previousData = [];
    let CALIBRATION = 94
    const splDisplay = document.getElementById('spl_value');
    function change_calibration() {CALIBRATION = document.getElementById('input-db').value}
    // 校准偏移：将 dBFS 转为近似的 dB SPL，需要实际测量后填写（单位：dB）
    // 例如：将已知声压（94 dB SPL）对应的 dBFS 测得值相减得到偏移
    
    // 设置Canvas尺寸为窗口大小
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.6;
    }
    
    // 初始化尺寸并监听窗口大小变化
    resizeCanvas();
    
    // 防抖函数限制调整大小事件的频率
    function debounce(func, wait) {
        let timeout;
        return function (...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }
    
    // 使用防抖的调整大小监听器
    window.addEventListener('resize', debounce(resizeCanvas, 100));
    
    // 初始化音频分析器
    function initAudio() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        previousData = new Array(bufferLength).fill(0);
        // 时域缓冲长度使用 fftSize
        timeDomainArray = new Float32Array(analyser.fftSize);
    }
    
    // 停止可视化
    function stopVisualization() {
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        isActive = false;
    }
    
    // Web Worker setup
const workerScript = `
        // Store previous smoothed values in Q8.8 fixed-point (Uint16) to avoid Float32Array
        // Memory per bin: prev 2 bytes + out 1 byte = 3 bytes/bin (very small)
        let prevQ88 = null;   // Uint16Array
        let outU8 = null;     // Uint8Array

        // Weights in Q0.8: 0.3 ~= 77/256, 0.7 ~= 179/256
        const A = 77;
        const B = 179;

        onmessage = (event) => {
            const inU8 = event.data; // EXPECTED: Uint8Array
            const n = inU8.length | 0;

            if (!prevQ88 || prevQ88.length !== n) {
                prevQ88 = new Uint16Array(n);
                outU8 = new Uint8Array(n);
            }

            for (let i = 0; i < n; i++) {
                const inQ88 = inU8[i] << 8; // convert input to Q8.8
                const smQ88 = (inQ88 * A + prevQ88[i] * B) >> 8; // back to Q8.8
                prevQ88[i] = smQ88;
                outU8[i] = smQ88 >> 8; // back to 0..255
            }

            postMessage(outU8); // reused; avoids allocating a new array each frame
        };
    `;

// Create a Blob URL for the worker
const workerBlob = new Blob([workerScript], { type: 'application/javascript' });
workerBlobURL = URL.createObjectURL(workerBlob);

// Initialize the Web Worker using the Blob URL
worker = new Worker(workerBlobURL);

// Limit refresh rate to 30 FPS
const FRAME_INTERVAL = 1000 / 35;
let lastFrameTime = 0;

// Modify drawVisualization to use worker data
function drawVisualization(processedData) {
    const now = performance.now();
    if (now - lastFrameTime < FRAME_INTERVAL) return;
    lastFrameTime = now;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const barWidth = (canvas.width / processedData.length) * 2.5;
    let x = 0;

    for (let i = 0; i < processedData.length; i++) {
        const barHeight = (processedData[i] / 255) * canvas.height;
        const hue = 180 + (i / processedData.length) * 200;
        const alpha = 0.6 + (processedData[i] / 255) * 0.4;
        ctx.fillStyle = `hsla(${hue}, 100%, 50%, ${alpha})`;

        const y = canvas.height - barHeight;
        ctx.fillRect(x, y, barWidth, barHeight);

        if (barHeight > 5) {
            ctx.fillStyle = `hsla(${hue}, 100%, 80%, ${alpha * 0.8})`;
            ctx.fillRect(x, y, barWidth, Math.max(2, barHeight * 0.15));
        }

        x += barWidth + 1;
    }
}
let current_db = 0
// Modify startMic to send data to the worker
async function startMic() {
    try {
        const response = await fetch('../temp.json');
        if (!response.ok) {
            throw new Error('Failed to fetch temp.json');
        }
        const jsonData = await response.json();
        console.log('Loaded JSON data:', jsonData);
        CALIBRATION = jsonData['calibration']
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

        if (!audioContext) {
            initAudio();
        } else if (audioContext.state === 'suspended') {
            await audioContext.resume();
        }

        if (microphone) {
            microphone.disconnect();
        }

        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        isActive = true;

        function processAudio() {
            if (!isActive) return;
    
            analyser.getByteFrequencyData(dataArray);
            // 读取时域数据并计算 RMS -> dBFS -> 近似 dB SPL
            analyser.getFloatTimeDomainData(timeDomainArray);
            let sumSquares = 0;
            for (let i = 0; i < timeDomainArray.length; i++) {
                const s = timeDomainArray[i];
                sumSquares += s * s;
            }
            const rms = Math.sqrt(sumSquares / timeDomainArray.length) || Number.EPSILON;
            // dBFS（全尺度参考）：20 * log10(rms)
            const dbfs = 20 * (Math.log10 ? Math.log10(rms) : Math.log(rms) / Math.LN10);
            const dbSpl = dbfs + CALIBRATION;
            current_db = Math.round(dbSpl)
            if (splDisplay) splDisplay.textContent = `${Math.round(dbSpl)} dB`;
+
            worker.postMessage(dataArray);
            setTimeout(processAudio, FRAME_INTERVAL);
        }
    
        processAudio();
    
    } catch (err) {
        console.error('麦克风访问错误:', err);
        stopVisualization();
        // 显示错误信息
        ctx.fillStyle = 'white';
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('无法访问麦克风，请检查权限设置', canvas.width/2, canvas.height/2);
    }
}
function calibration() {
    get_input = document.getElementById("input-db").value
    console.log(get_input)
    calibration = get_input - current_db
    window.pywebview.api.receive_msg(calibration).then((result) => {
        if (result == "200") {
            console.log("OK!")
            alert("校准完成！\n页面即将关闭！")
            window.pywebview.api.destroy_window()
        }
    }).catch((err) => {
        alert(`校准出错!\n ${err}`)
    });
}
// Listen for processed data from the worker
worker.onmessage = (event) => {
    drawVisualization(event.data);
};

// 页面加载完成后自动启动
window.addEventListener('load', startMic);

// 卸载页面前的清理工作
window.addEventListener('beforeunload', () => {
    stopVisualization();
    if (audioContext) {
        audioContext.close();
    }
});
    </script>
</body>
</html>
